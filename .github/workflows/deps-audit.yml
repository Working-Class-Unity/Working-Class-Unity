name: Dependency Audit (npm)

on:
  pull_request:
    paths:
      - "wcu-website/package.json"
      - "wcu-website/package-lock.json"
      - ".github/workflows/deps-audit.yml"
  push:
    branches:
      - master
      - feature/**
    paths:
      - "wcu-website/package.json"
      - "wcu-website/package-lock.json"
      - ".github/workflows/deps-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wcu-website

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wcu-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (gate)
        run: node scripts/npm-audit-gate.mjs
