name: Quality (Lint, Typecheck, Unit)

on:
  pull_request:
    paths:
      - "wcu-website/**"
      - ".github/workflows/quality.yml"
  push:
    branches:
      - master
      - feature/**
    paths:
      - "wcu-website/**"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wcu-website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wcu-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run quality
