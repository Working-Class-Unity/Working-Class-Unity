name: SAST (Semgrep OWASP Top 10)

on:
  pull_request:
    paths:
      - "wcu-website/**"
      - ".github/workflows/semgrep.yml"
  push:
    branches:
      - master
      - feature/**
    paths:
      - "wcu-website/**"
      - ".github/workflows/semgrep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check --no-cache-dir semgrep

      - name: Run Semgrep (OWASP Top 10)
        run: semgrep --config p/owasp-top-ten --error wcu-website
