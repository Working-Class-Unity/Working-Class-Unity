version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/wcu-website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      nuxt-and-vue:
        patterns:
          - "nuxt"
          - "vue"
          - "@vue/*"
          - "@nuxt/*"
      tooling:
        patterns:
          - "eslint"
          - "@nuxt/eslint"
          - "typescript"
          - "vitest"
          - "@playwright/test"
          - "@axe-core/playwright"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
