  BACKUP_R2_ENDPOINT: '${BASELINE_BACKUP_ENV_EMPTY:-}'
  BACKUP_R2_ACCESS_KEY_ID: '${BASELINE_BACKUP_ENV_EMPTY:-}'
  BACKUP_R2_SECRET_ACCESS_KEY: '${BASELINE_BACKUP_ENV_EMPTY:-}'
x-app-image: &app-image
  image: '${COMPOSE_PROJECT_NAME}_app:${SOURCE_COMMIT:?Set SOURCE_COMMIT to the selected Git commit}'
  pull_policy: never
services:
  migrate:
    <<: *app-image
    build: .
    command:
      - node
      - .output/server/maintenance.mjs
      - migrate
      - --confirm-app-stopped
    restart: 'no'
    healthcheck:
      disable: true
    environment: *runtime-environment
    volumes:
      - app-data:/app/data

  web:
    <<: *app-image
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment: *runtime-environment
    expose:
      - '3000'
    volumes:
      - app-data:/app/data

  worker:
    <<: *app-image
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - node
      - --import
      - ./.output/server/worker-sentry.server.config.mjs
      - .output/server/worker.mjs
    restart: unless-stopped
    init: true
    stop_grace_period: 360s
    healthcheck:
      disable: true
    environment: *runtime-environment
    volumes:
      - app-data:/app/data

  backup-runner:
    <<: *app-image
    profiles:
      - backup
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - sh
      - -ec
      - |
        node .output/server/off-host-backup.mjs validate-config
        exec sleep infinity
    restart: unless-stopped
    init: true
    healthcheck:
      disable: true
    environment:
      <<: *runtime-environment
      BACKUP_R2_ACCOUNT_ID: '${BACKUP_R2_ACCOUNT_ID-}'
      BACKUP_R2_BUCKET: '${BACKUP_R2_BUCKET-}'
      BACKUP_R2_ENDPOINT: '${BACKUP_R2_ENDPOINT-}'
      BACKUP_R2_ACCESS_KEY_ID: '${BACKUP_R2_ACCESS_KEY_ID-}'
      BACKUP_R2_SECRET_ACCESS_KEY: '${BACKUP_R2_SECRET_ACCESS_KEY-}'
    volumes:
      - app-data:/app/data

volumes:
  app-data:
